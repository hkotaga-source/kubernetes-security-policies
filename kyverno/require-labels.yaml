apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-for-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
      validate:
        message: "The label `app` and `team` are required."
        pattern:
          metadata:
            labels:
              app: "?*"
              team: "?*"
